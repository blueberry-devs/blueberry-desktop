name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: blueberry-win
            server-script: scripts\build-server.bat

          - os: macos-latest
            artifact: blueberry-mac
            server-script: bash scripts/build-server.sh

          - os: ubuntu-22.04
            artifact: blueberry-linux
            server-script: bash scripts/build-server.sh

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Generate token for private submodules
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          owner: blueberry-devs
          repositories: blueberry-desktop,blueberry-music-lib

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server
            src-tauri

      - name: Install Node deps
        run: pnpm install --frozen-lockfile

      - name: Build server sidecar
        run: ${{ matrix.server-script }}

      - name: Write .env for sidecar
        shell: bash
        run: |
          cat > resources/.env <<EOF
          SOUNDCLOUD_CLIENT_ID=${{ secrets.SOUNDCLOUD_CLIENT_ID }}
          YANDEX_TOKEN=${{ secrets.YANDEX_TOKEN }}
          YANDEX_PROXY_URL=${{ secrets.YANDEX_PROXY_URL }}
          EOF

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old artifact (keep only latest)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts" \
            --jq '.artifacts[] | select(.name == "${{ matrix.artifact }}") | .id' \
            | xargs -I{} gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/{}" \
            || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: warn
