name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump (skip if already bumped)
        type: choice
        options:
          - patch
          - minor
          - major
          - skip
        default: patch
      release_notes:
        description: Short summary (optional — full notes from RELEASE_NOTES.md)
        type: string
        required: false

jobs:
  bump-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Generate token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          owner: blueberry-devs
          repositories: blueberry-desktop

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump version and push
        id: bump
        run: |
          if [ "${{ inputs.version_bump }}" = "skip" ]; then
            VERSION=$(node -p "require('./package.json').version")
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Skipping version bump, current: $VERSION"
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Bump in package.json
          npm version ${{ inputs.version_bump }} --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")

          # Sync version into tauri.conf.json
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            conf.version = '$VERSION';
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
          "
          # Sync version into Cargo.toml
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          git commit -m "v${VERSION}"
          git tag "v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git push
          git push --tags

  build:
    needs: bump-version
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: blueberry-win
            server-script: scripts\build-server.bat

          - os: macos-latest
            artifact: blueberry-mac
            server-script: bash scripts/build-server.sh

          - os: ubuntu-22.04
            artifact: blueberry-linux
            server-script: bash scripts/build-server.sh

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Generate token for private submodules
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          owner: blueberry-devs
          repositories: blueberry-desktop,blueberry-music-lib

      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.bump-version.outputs.version }}
          fetch-tags: true
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server
            src-tauri

      - name: Install Node deps
        run: pnpm install --frozen-lockfile

      - name: Build server sidecar
        run: ${{ matrix.server-script }}

      - name: Write .env for sidecar
        shell: bash
        run: |
          cat > src-tauri/resources/.env <<EOF
          SOUNDCLOUD_CLIENT_ID=${{ secrets.SOUNDCLOUD_CLIENT_ID }}
          YANDEX_TOKEN=${{ secrets.YANDEX_TOKEN }}
          YANDEX_PROXY_URL=${{ secrets.YANDEX_PROXY_URL }}
          EOF

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Delete old artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/actions/artifacts" \
            --jq '.artifacts[] | select(.name == "${{ matrix.artifact }}") | .id' \
            | xargs -I{} gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/{}" \
            || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: warn

  create-release:
    needs: [bump-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.bump-version.outputs.version }}

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Collect release files
        run: |
          mkdir release
          find release-artifacts -type f \( \
            -name '*.exe' -o -name '*.msi' -o -name '*.nsis.zip' \
            -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
            -o -name '*.dmg' -o -name '*.app.tar.gz' \
            -o -name '*.sig' -o -name 'latest.json' \
          \) -exec cp {} release/ \;
          ls -la release/

      - name: Build release body
        id: body
        run: |
          BODY_FILE="${{ runner.temp }}/release_body.md"
          SUMMARY="${{ inputs.release_notes }}"

          if [ -n "$SUMMARY" ]; then
            echo "$SUMMARY" > "$BODY_FILE"
            echo "" >> "$BODY_FILE"
          else
            > "$BODY_FILE"
          fi

          if [ -f "RELEASE_NOTES.md" ]; then
            cat RELEASE_NOTES.md >> "$BODY_FILE"
          fi

          echo "path=$BODY_FILE" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.bump-version.outputs.version }}
          name: v${{ needs.bump-version.outputs.version }}
          body_path: ${{ steps.body.outputs.path }}
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: false
