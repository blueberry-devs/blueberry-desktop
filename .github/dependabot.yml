version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/Moscow
    versioning-strategy: increase
    groups:
      react:
        patterns:
          - 'react*'
          - '@types/react*'
      vite:
        patterns:
          - 'vite*'
          - '@vitejs/*'
      tauri:
        patterns:
          - '@tauri-apps/*'

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/Moscow
    groups:
      tauri:
        patterns:
          - 'tauri*'

  - package-ecosystem: cargo
    directory: /server
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/Moscow
